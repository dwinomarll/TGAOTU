name: factory-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all factory test suites
        run: |
          rc=0
          for t in factory/test_*.py; do
            echo "== $t =="
            python3 "$t" || rc=1
          done
          exit $rc
